# Render 的雲端唯讀歌詞服務。免費方案:512 MB RAM、閒置 15 分鐘休眠 (冷啟動 30~60 秒)、
# 磁碟是暫時的 —— 歌詞快取每次重啟都掉,重抓即可 (它本來就是快取)。
services:
  - type: web
    name: kanaric        # 網址是 <name>.onrender.com,小寫 —— 子網域不吃大寫
    runtime: docker
    plan: free
    # 離台灣近,而且**網易從這個 region 實測打得通** (2026-08-01,線上第一首歌的
    # 「歌詞來源」就是 NetEase) —— 這是上雲前最後一個未知數:三家全不通的話這台
    # 只剩 lrclib,注音的羅馬字 hint 層會整個沒有。要換 region 前先重驗這件事。
    region: singapore
    healthCheckPath: /mobile/  # /api/* 要 token,/ 是 404,只有這條能當健康檢查
    envVars:
      - key: CLOUD_MODE
        value: "1"
      - key: MOBILE_TOKEN
        generateValue: true    # Render 自己產一組,到 Dashboard 複製到手機上
      - key: PUBLIC_ORIGIN
        sync: false            # 部署後填實際網址 https://<name>.onrender.com
