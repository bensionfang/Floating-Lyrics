<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanaric">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Kanaric Mobile</title>
<style>
  /* 版面刻意不用桌面版的 public/css/style.css —— 那份是為桌面 grid 寫的 */
  :root {
    --bg: #121212; --border: rgba(255,255,255,.14);
    --text: #fff; --dim: #b3b3b3; --accent: #1DB954;
    --lyric-dim: rgba(255,255,255,0.5);   /* 由封面主色決定,見 color.js */
    --lyric-fs: 32px; --lyric-align: left;   /* 預設值同時寫在 JS 的 DEFAULT_PREFS,兩邊要一致 */
  }
  * { box-sizing: border-box; }
  /* 全螢幕歌詞:整頁不捲動,只有歌詞區自己捲。
     100dvh 不是 100vh —— Safari 分頁模式的網址列會吃掉高度,vh 量的是「網址列收起來時」
     的值,底部播放列會被切掉一截 (standalone 模式看不出來,用瀏覽器開就很明顯) */
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    /* 下緣的 safe area 不放這裡,交給 .playbar 自己吃一部分 —— 見那邊的註解 */
    padding: env(safe-area-inset-top) 0 0;
    -webkit-text-size-adjust: 100%;
    transition: background-color .6s;   /* 換歌時背景漸變,不要硬跳 */
  }
  .hidden { display: none !important; }

  /* --- 頂列:⋯ 在左,歌名/歌手置中兩行 --- */
  /* 三欄 grid 而不是 flex + space-between:右邊那個等寬的空欄是為了讓中間**真的**置中,
     不然歌名會被左邊那顆按鈕推偏 40px */
  .top {
    flex-shrink: 0; display: grid; grid-template-columns: 40px 1fr 40px;
    align-items: center; padding: 6px 12px; gap: 8px;
  }
  .top-text { min-width: 0; text-align: center; }   /* min-width:0 讓長歌名縮得下去而不是撐爆格線 */
  .icon-btn {
    background: transparent; border: 0; color: var(--text); opacity: .8;
    width: 40px; height: 40px; padding: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-appearance: none;
  }
  .icon-btn:active { opacity: 1; background: rgba(255,255,255,.12); }

  /* --- 歌詞 --- */
  /* position 不可以拿掉:置中是靠 el.offsetTop 算的,沒有它 offsetParent 會變成 <body>,
     量到的是「離整頁頂端」的距離 (多算了頂列),當前行就被推到畫面上方外 */
  .lyrics {
    position: relative; flex: 1; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    /* 上緣只留一點點:**第一句要貼在畫面上方,不是被推到正中央**。捲不上去時
       scrollTo 自己會夾住,所以 syncLyrics 那條置中邏輯不必改。
       這個留白要**大於下面遮罩的上緣淡出高度 (20px)**,否則第一句一開始就是半透明的 ——
       所以那個淡出寫成固定 px 而不是 %,%的話面板一變高淡出區就跟著長,又會蓋回第一句。
       下緣留 45vh 是必要的 —— 沒有它最後幾句永遠捲不到畫面中央,會卡在最底下 */
    padding: 26px 22px 45vh;
    /* 與頂列/播放列接觸的地方淡出,歌詞不會硬生生被切斷。
       -webkit- 前綴不能省:iOS Safari 到現在還是只認前綴版的 mask-image */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 90%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 90%, transparent 100%);
  }
  .lyrics p {
    margin: 0; padding: 12px 0; line-height: 1.85;
    font-size: var(--lyric-fs); text-align: var(--lyric-align);
    color: var(--lyric-dim); font-weight: 600;
    transition: color .25s, opacity .25s; opacity: .85;
    /* 長按是「設循環點」,iOS 預設會跳出選取/複製泡泡蓋在歌詞上。
       **這兩行與 JS 那邊 preventDefault 掉 contextmenu 是一組的,少一件就會看到泡泡** */
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .lyrics p.on { color: var(--text); opacity: 1; }
  .lyrics p.loop { background: rgba(29,185,84,.16); border-radius: 10px; }
  /* ruby 在 iOS Safari 預設會把行高撐開,自己壓一下讀音大小 */
  .lyrics rt { font-size: .5em; font-weight: 400; opacity: .75; }
  body.no-furigana rt { display: none; }
  /* 譯文跟著歌詞本體走,只小一號、不斜體 —— 唱到那句一起反白 (顏色靠 .lyrics p 繼承) */
  .tr { display: block; font-size: .62em; font-weight: 400; opacity: .8; margin-top: 2px; }
  body.no-trans .tr { display: none; }
  .lyrics .empty { text-align: center; color: var(--lyric-dim); font-weight: 400; opacity: .8; }

  /* --- 播放列上方的工具條 --- */
  /* 微調時間軸要邊聽邊調,所以不放抽屜 (抽屜幾乎蓋滿螢幕,看不到歌詞就沒辦法對)。
     用 keyframes 做滑出而不是 transition:display:none 的元素 transition 不會觸發,
     而這條要進出 flex 排版,留著佔位又會擠掉歌詞 */
  .tools {
    flex-shrink: 0; margin: 0 16px 8px; padding: 6px 12px; border-radius: 14px;
    background: rgba(255,255,255,.10); font-size: 13px;
    animation: slideup .2s ease;
  }
  @keyframes slideup { from { opacity: 0; transform: translateY(12px); } }
  .trow { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .trow > span:first-child { flex: 1; opacity: .7; }
  .tdim { opacity: .7; font-variant-numeric: tabular-nums; }
  .tbtn, .tval {
    background: rgba(255,255,255,.14); border: 0; color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 14px;
    cursor: pointer; -webkit-appearance: none;
  }
  .tval { font-variant-numeric: tabular-nums; min-width: 64px; }

  /* --- 底部播放列 --- */
  /* 下緣只吃「safe area 減 28px」:整個 inset (iPhone 約 34px) 留白會讓控制列離底部太遠,
     Spotify / Apple Music 都貼得更下面。減完剩約 6px —— 已經很貼,再往下播放鍵就會壓到
     home indicator 那條線上。max() 是給沒有 inset 的環境 (桌面、Android) 保底,
     不然算出來是負值 */
  .playbar {
    flex-shrink: 0;
    padding: 6px 20px max(0px, calc(env(safe-area-inset-bottom) - 28px));
  }
  /* 封面刻意不顯示:畫面的底色就是從它採樣來的,這一頁的角色是「看歌詞」。
     但 <img> 必須留在 DOM 裡而且要真的載入 —— 主色採樣是掛在它的 load 事件上的。
     display:none 不會阻止圖片下載,所以用它是安全的;**不要改成不插入 <img>** */
  #art { display: none; }
  .track-title, .track-artist {
    margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .track-title { font-size: 20px; font-weight: 700; }
  .track-artist { font-size: 16px; opacity: .75; margin-top: 2px; }
  /* 進度條由 rAF 每幀寫 width,所以刻意不加 CSS transition —— 兩邊會互相打架而變黏。
     外面包一層高一點的 .hit 是為了好按:視覺 4px、觸控區 20px */
  .hit { padding: 8px 0; cursor: pointer; }
  .bar { height: 4px; background: rgba(255,255,255,.28); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--text); }
  .times { display: flex; justify-content: space-between; margin-top: 4px;
           font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
  .ctrl { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 2px; }
  .ctrl .icon-btn { width: 48px; height: 48px; }
  .ctrl .play { width: 58px; height: 58px; background: var(--text); color: #000; opacity: 1; }
  .ctrl .play:active { background: var(--text); opacity: .85; }

  .msg { font-size: 12px; text-align: center; opacity: .7; margin: 0 0 6px;
         word-break: break-word; min-height: 15px; }
  .msg.err { color: #ff8b8b; opacity: 1; }
  /* 沒有活躍裝置時才出現 (見 JS 的 resumeOnSpotify) */
  .resume {
    display: block; margin: 0 auto 8px; padding: 9px 18px;
    background: var(--accent); color: #000; border: 0; border-radius: 999px;
    font-size: 14px; font-weight: 600; cursor: pointer; -webkit-appearance: none;
  }

  /* --- 設定側欄 (從左邊滑出) --- */
  /* 開關用 .open 而不是 .hidden:display:none 會讓 transition 完全不觸發,
     滑出動畫就變成瞬間出現。遮罩同理走 opacity + pointer-events */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    width: min(86vw, 340px);
    background: #181818; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))
             max(20px, env(safe-area-inset-left));
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 4px 0 28px rgba(0,0,0,.5);
  }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 15px; margin: 0 0 14px; opacity: .6; font-weight: 600; }
  .srow { display: flex; align-items: center; justify-content: space-between;
          gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .srow:first-of-type { border-top: 0; }
  .srow input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  /* tabular-nums + 固定寬度:數字從 14 跳到 100 時滑桿不會跟著抽動 */
  .srow .val { flex-shrink: 0; width: 44px; text-align: right;
               font-variant-numeric: tabular-nums; opacity: .7; font-size: 13px; }
  .srow input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--dim);
                padding: 7px 14px; font-size: 13px; cursor: pointer; -webkit-appearance: none; }
  .seg button.on { background: var(--accent); color: #000; font-weight: 600; }
  .drawer label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 6px; }
  .drawer input[type=text], .drawer input[type=password] {
    width: 100%; padding: 11px; font-size: 16px;   /* 16px 以下 iOS Safari 會自動放大整頁 */
    background: #000; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  }
  .drawer .btn {
    width: 100%; padding: 13px; margin-top: 12px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #000; border: 0; border-radius: 999px;
    cursor: pointer; -webkit-appearance: none;
  }
  .drawer .btn.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  /* 備選歌詞清單:順著抽屜往下長,不另開一層 */
  .opt {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; border-top: 1px solid var(--border); color: var(--text);
    padding: 10px 0; font-size: 14px; cursor: pointer; -webkit-appearance: none;
  }
  .opt small { display: block; color: var(--dim); font-size: 11px; margin-top: 3px; }
  .hint { font-size: 11px; color: var(--dim); margin: 10px 0 0; word-break: break-all; }
  code { background: #000; padding: 2px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div class="top">
  <button id="menu-btn" class="icon-btn" aria-label="設定">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
    </svg>
  </button>
  <div class="top-text">
    <p class="track-title" id="track-title">—</p>
    <p class="track-artist" id="track-artist">—</p>
  </div>
  <!-- 右欄本來是為了「讓中間真的置中」的空格,現在正好給工具條的開關用 (同寬) -->
  <button id="tools-btn" class="icon-btn" aria-label="歌詞工具">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/>
      <circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>
    </svg>
  </button>
</div>

<div id="lyrics" class="lyrics"></div>

<div id="tools" class="tools hidden">
  <div class="trow"><span>歌詞時間軸</span>
    <button class="tbtn" id="off-minus" aria-label="歌詞提前">−</button>
    <button class="tval" id="off-val" aria-label="歸零">0.0s</button>
    <button class="tbtn" id="off-plus" aria-label="歌詞延後">＋</button>
  </div>
  <div class="trow"><span>段落循環</span>
    <span class="tdim" id="loop-val">長按歌詞設起點</span>
    <button class="tbtn hidden" id="loop-clear" aria-label="取消循環">✕</button>
  </div>
</div>

<div id="playbar" class="playbar hidden">
  <p id="status" class="msg"></p>
  <button id="resume-btn" class="resume hidden">在 Spotify 開始播放</button>
  <!-- 封面不顯示 (見 CSS 的 .art),但一定要留著而且要載入 —— 主色採樣掛在它的 load 事件上。
       crossorigin 是採樣的前提:不加的話 canvas 被跨網域污染,getImageData 直接丟
       SecurityError。要寫在 HTML 屬性上 —— 設完 src 才補是不生效的 -->
  <img id="art" crossorigin="anonymous" alt="">
  <div class="hit" id="prog-hit">
    <div class="bar"><i id="bar-fill"></i></div>
  </div>
  <div class="times"><span id="pos-fmt">0:00</span><span id="dur-fmt">0:00</span></div>
  <div class="ctrl" id="ctrl">
    <button class="icon-btn" data-act="previous" aria-label="上一首">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3 6l9-6v12z"/>
      </svg>
    </button>
    <button class="icon-btn play" id="play-btn" aria-label="播放或暫停">
      <svg id="ico-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 5l12 7-12 7z"/>
      </svg>
      <svg id="ico-pause" class="hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/>
      </svg>
    </button>
    <button class="icon-btn" data-act="next" aria-label="下一首">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/>
      </svg>
    </button>
  </div>
</div>

<div id="scrim" class="scrim"></div>
<div id="drawer" class="drawer">
  <h2>設定</h2>

  <div class="srow"><span>歌詞文字大小</span>
    <input type="range" id="set-fs" min="20" max="44" step="1">
    <span class="val" id="set-fs-val">—</span>
  </div>
  <div class="srow"><span>歌詞對齊</span>
    <div class="seg" id="set-align">
      <button data-align="left">左</button>
      <button data-align="center">中</button>
      <button data-align="right">右</button>
    </div>
  </div>
  <div class="srow"><span>顯示日文假名</span>
    <input type="checkbox" id="set-furigana">
  </div>
  <div class="srow"><span>顯示中文翻譯</span>
    <input type="checkbox" id="set-trans">
  </div>
  <div class="srow"><span>歌詞來源</span><span id="lyrics-source">—</span></div>

  <button id="opts-btn" class="btn ghost">搜尋備選歌詞</button>
  <button id="reload-btn" class="btn ghost">重新載入歌詞</button>
  <div id="opts"></div>

  <label for="client-id">Spotify Client ID</label>
  <input id="client-id" type="text" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" placeholder="Dashboard 上那串 32 碼">
  <label for="api-token">歌詞服務 Token</label>
  <input id="api-token" type="password" autocomplete="off" placeholder="Render 上的 MOBILE_TOKEN">

  <button id="login-btn" class="btn">連接 Spotify</button>
  <button id="logout-btn" class="btn ghost">登出</button>
  <button id="close-btn" class="btn ghost">關閉</button>
  <p class="hint">
    Redirect URI 要在 Spotify Dashboard 註冊為 <code id="redirect-hint"></code>。
    Client ID 是公開值,只存在這台裝置的瀏覽器裡。
  </p>
</div>

<script src="pkce.js"></script>
<script src="playback.js"></script>
<script src="lyrics.js"></script>
<script src="color.js"></script>
<script>
(() => {
  'use strict';

  const AUTH_URL  = 'https://accounts.spotify.com/authorize';
  const TOKEN_URL = 'https://accounts.spotify.com/api/token';
  const API       = 'https://api.spotify.com/v1';
  // modify 是播放控制要的。**改動這個字串等於讓已存的 refresh_token 失效** —— 它是用舊
  // scope 換來的,拿去打控制端點只會回 403,而症狀看起來像「Premium 沒生效」,無從猜起。
  // 所以下面用 LS_SCOPE 記住上次授權用的 scope,對不上就強制重新連接。
  const SCOPE = 'user-read-playback-state user-modify-playback-state';

  const LS_CLIENT  = 'kanaric.mobile.clientId';
  const LS_REFRESH = 'kanaric.mobile.refreshToken';
  const LS_TOKEN   = 'kanaric.mobile.apiToken';   // 雲端 /api/lyrics 的 token
  const LS_SCOPE   = 'kanaric.mobile.scope';
  const LS_PREFS   = 'kanaric.mobile.prefs';      // 純顯示偏好,一個鍵存一個物件
  const LS_OFFSETS = 'kanaric.mobile.offsets';    // 每首歌的歌詞時間偏移 (秒)
  const SS_VERIFIER = 'kanaric.mobile.verifier';
  const SS_STATE    = 'kanaric.mobile.state';

  // redirect_uri 由現在的網址推出來,同一份程式碼在 127.0.0.1 與雲端網域都正確
  // (兩個都要在 Dashboard 註冊)。直接開 index.html 時 pathname 會多一段,要剝掉 ——
  // 沒剝的話送出去的 redirect_uri 與註冊的那條對不上,Spotify 回 INVALID_CLIENT。
  const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, '');

  const $ = (id) => document.getElementById(id);
  const setStatus = (text, isError = false) => {
    $('status').textContent = text || '';
    $('status').classList.toggle('err', !!isError);
  };

  // access_token 只放記憶體 (重整就重拿,refresh_token 才進 localStorage)
  let accessToken = null;
  let expiresAt = 0;

  const clientId = () => localStorage.getItem(LS_CLIENT) || '';

  // --- 顯示偏好 (純前端,不進 server) ---------------------------------------

  // fs 的預設 32 = 滑桿 (20~44) 的正中央,往兩邊都調得動。改這裡要一起改 CSS 的 --lyric-fs
  const DEFAULT_PREFS = { fs: 32, align: 'left', furigana: true, trans: true };

  function readPrefs() {
    try { return { ...DEFAULT_PREFS, ...JSON.parse(localStorage.getItem(LS_PREFS) || '{}') }; }
    catch (e) { return { ...DEFAULT_PREFS }; }
  }

  function applyPrefs(p) {
    document.documentElement.style.setProperty('--lyric-fs', `${p.fs}px`);
    document.documentElement.style.setProperty('--lyric-align', p.align);
    document.body.classList.toggle('no-furigana', !p.furigana);
    document.body.classList.toggle('no-trans', !p.trans);
    $('set-fs').value = p.fs;
    $('set-fs-val').textContent = `${p.fs}px`;
    $('set-furigana').checked = p.furigana;
    $('set-trans').checked = p.trans;
    for (const b of $('set-align').children) b.classList.toggle('on', b.dataset.align === p.align);
  }

  function savePrefs(patch) {
    const next = { ...readPrefs(), ...patch };
    localStorage.setItem(LS_PREFS, JSON.stringify(next));
    applyPrefs(next);
  }

  // --- 設定面板 -------------------------------------------------------------

  function openSheet() {
    $('client-id').value = clientId();
    $('api-token').value = localStorage.getItem(LS_TOKEN) || '';
    // 「連接 Spotify」與「登出」是互斥的,同時出現只會讓人猶豫該按哪顆。
    // 已登入但想換 Client ID 的話:先登出再連接 (兩下,但狀態不會曖昧)
    const signedIn = !!localStorage.getItem(LS_REFRESH);
    $('login-btn').classList.toggle('hidden', signedIn);
    $('logout-btn').classList.toggle('hidden', !signedIn);
    $('drawer').classList.add('open');
    $('scrim').classList.add('open');
  }

  function closeSheet() {
    $('drawer').classList.remove('open');
    $('scrim').classList.remove('open');
  }

  // --- OAuth ---------------------------------------------------------------

  async function login() {
    const id = $('client-id').value.trim();
    if (!id) return setStatus('請先填入 Client ID', true);
    localStorage.setItem(LS_CLIENT, id);
    localStorage.setItem(LS_TOKEN, $('api-token').value.trim());   // 沒填也存,空字串等於沒 token

    const verifier = randomVerifier();
    const state = randomVerifier(43);
    sessionStorage.setItem(SS_VERIFIER, verifier);
    sessionStorage.setItem(SS_STATE, state);

    const params = new URLSearchParams({
      client_id: id,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      scope: SCOPE,
      state,
      code_challenge_method: 'S256',
      code_challenge: await challengeFor(verifier),
    });
    location.href = `${AUTH_URL}?${params}`;
  }

  async function postToken(body) {
    const resp = await fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(body),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error_description || data.error || `token 端點回 ${resp.status}`);
    accessToken = data.access_token;
    expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
    // 更新時 Spotify 不一定會回新的 refresh_token,沒回就沿用舊的
    if (data.refresh_token) localStorage.setItem(LS_REFRESH, data.refresh_token);
    return data;
  }

  // 從授權頁導回來:? 裡帶 code 或 error
  async function handleRedirect() {
    const q = new URLSearchParams(location.search);
    const code = q.get('code');
    const error = q.get('error');
    if (!code && !error) return false;

    // code 只能用一次,先把 query string 清掉,否則重整會拿用過的 code 再換一次而失敗
    history.replaceState(null, '', REDIRECT_URI);

    if (error) { setStatus(`授權被拒:${error}`, true); return false; }

    const expected = sessionStorage.getItem(SS_STATE);
    const verifier = sessionStorage.getItem(SS_VERIFIER);
    sessionStorage.removeItem(SS_STATE);
    sessionStorage.removeItem(SS_VERIFIER);
    if (!expected || q.get('state') !== expected) { setStatus('state 不符,授權中止', true); return false; }
    if (!verifier) { setStatus('找不到 code_verifier,請重新授權', true); return false; }

    await postToken({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: clientId(),
      code_verifier: verifier,
    });
    // 這份 refresh_token 是用哪組 scope 換的,記下來給下次開 app 比對
    localStorage.setItem(LS_SCOPE, SCOPE);
    return true;
  }

  /** 統一的 token 出口:到期前 60 秒就先換新的 (規格 §3.1)。拿不到就回 null,由呼叫端退回登入畫面 */
  async function getToken() {
    if (accessToken && Date.now() < expiresAt - 60000) return accessToken;
    const refresh = localStorage.getItem(LS_REFRESH);
    if (!refresh || !clientId()) return null;
    try {
      await postToken({ grant_type: 'refresh_token', refresh_token: refresh, client_id: clientId() });
      return accessToken;
    } catch (e) {
      // iOS 的 ITP 可能清掉儲存,或授權被撤銷 —— 不要卡死,回到登入畫面重來
      localStorage.removeItem(LS_REFRESH);
      accessToken = null;
      setStatus(`需要重新授權:${e.message}`, true);
      return null;
    }
  }

  function logout() {
    localStorage.removeItem(LS_REFRESH);
    accessToken = null;
    expiresAt = 0;
    showSetup();
    setStatus('已登出');
  }

  // --- 播放狀態 -------------------------------------------------------------

  let track = null;      // playback.js 的快照,插值的基準
  let pollTimer = null;

  /** 打一次 /me/player 並更新快照。回傳「下次輪詢要等多久」,回 null 表示照常 (pollDelay) */
  async function poll() {
    const token = await getToken();
    if (!token) { showSetup(); return Infinity; }   // 沒 token 就停手,等使用者重新授權

    try {
      const resp = await fetch(`${API}/me/player`, {
        headers: { Authorization: `Bearer ${token}` },
        cache: 'no-store',
      });
      if (resp.status === 204) {   // 沒有任何裝置在播 —— 是正常狀態,不是錯誤
        setTrack(null);
        setStatus('目前沒有播放中的裝置');
        // 暫停一陣子後裝置會從 Spotify 的活躍名單消失,這一頁就再也抓不到東西。
        // 那顆按鈕是唯一的出路 (setTrack(null) 走的 render 不會把它藏起來)
        $('resume-btn').classList.remove('hidden');
        return null;
      }
      // 401 只要把記憶體的 token 丟掉,下一輪 getToken() 會自己拿 refresh_token 換新的
      if (resp.status === 401) { accessToken = null; setStatus('token 失效,更新中…'); return 1000; }
      if (resp.status === 429) {
        // Spotify 會用 Retry-After (秒) 告訴你要等多久,照著等才不會一直被擋
        const wait = (Number(resp.headers.get('Retry-After')) || 30) * 1000;
        setStatus(`被 Spotify 限流,${Math.round(wait / 1000)} 秒後再試`, true);
        return wait;
      }
      if (!resp.ok) { setStatus(`Spotify 回 ${resp.status}`, true); return null; }
      setTrack(snapshot(await resp.json(), performance.now()));
      setStatus('');   // 成功就把狀態列清空 —— 每次輪詢印一行時間戳只是雜訊
      return null;
    } catch (e) {
      setStatus(`讀取失敗:${e.message}`, true);   // 家裡機器離線/飛航模式,下一輪再試
      return null;
    }
  }

  function setTrack(next) {
    // 換歌以 item.id 為準 (規格 §3.4) —— 同名歌太多,比歌名會誤判
    if ((next && next.id) !== (track && track.id)) loadLyrics(next);
    track = next;
    render(next);
  }

  // --- 播放控制 (需要 Premium) ----------------------------------------------

  let canControl = true;   // 收到 403 就整排收起來,不要每按一次吐一次

  /**
   * 控制端點回 204 而且不回新狀態,所以呼叫端要自己先把本地快照改掉 (樂觀更新),
   * 否則畫面得等下一輪輪詢 (最多 3 秒) 才會動,按起來像沒反應。
   * 送出後補一次輪詢校正真實狀態。
   */
  async function control(method, path, patch) {
    if (!canControl) return;
    const token = await getToken();
    if (!token) return;
    if (patch && track) { Object.assign(track, patch, { at: performance.now() }); render(track); }
    try {
      const resp = await fetch(`${API}/me/player/${path}`, {
        method, headers: { Authorization: `Bearer ${token}` },
      });
      // 403 = 免費帳號或 scope 不對;404 = 沒有可控制的裝置 (Spotify app 沒開)
      if (resp.status === 403) {
        canControl = false;
        $('ctrl').classList.add('hidden');
        return setStatus('播放控制需要 Spotify Premium', true);
      }
      // 404 = 沒有活躍裝置。這時把「在 Spotify 開始播放」叫出來,那顆才有辦法救
      if (resp.status === 404) {
        $('resume-btn').classList.remove('hidden');
        return setStatus('找不到播放裝置', true);
      }
      if (!resp.ok && resp.status !== 204) return setStatus(`控制失敗:${resp.status}`, true);
    } catch (e) {
      return setStatus(`控制失敗:${e.message}`, true);
    }
    clearTimeout(pollTimer);
    pollTimer = setTimeout(tick, 400);
  }

  /**
   * 「在 Spotify 開始播放」。Spotify 的裝置在閒置一段時間後會從活躍名單消失,
   * 那時 /me/player 回 204、控制端點回 404 —— **Web API 叫不醒一個已經消失的裝置**。
   *
   * 兩條路,先試不用跳出去的那條:
   *   1. /me/player/devices 還列得到裝置 → 直接把播放轉移過去並開始播,人不必離開這一頁。
   *      is_restricted 的裝置不吃 Web API 的控制,要跳過。
   *   2. 一台都沒有 = Spotify app 根本沒在跑 → 只能用 spotify: 把它叫起來,
   *      使用者自己按播放再切回來。**切回來不必做任何事** —— visibilitychange
   *      本來就會立刻補一次輪詢校正。
   */
  let pendingWake = false;   // 剛把使用者送去 Spotify,回前景時要自己接手按播放

  /** 找一台能控制的裝置並把播放轉移過去 (順便開始播)。成功回 true */
  async function transferToDevice() {
    const token = await getToken();
    if (!token) return false;
    try {
      const r = await fetch(`${API}/me/player/devices`, {
        headers: { Authorization: `Bearer ${token}` }, cache: 'no-store',
      });
      // is_restricted 的裝置不吃 Web API 的控制,挑了也是白挑
      const dev = ((await r.json()).devices || []).find((d) => !d.is_restricted);
      if (!dev) return false;
      setStatus('喚醒裝置中…');
      await fetch(`${API}/me/player`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_ids: [dev.id], play: true }),
      });
      clearTimeout(pollTimer);
      pollTimer = setTimeout(tick, 800);   // 轉移要一點時間才會反映到 /me/player
      return true;
    } catch (e) {
      return false;   // 查不到裝置就讓呼叫端決定下一步,不用吵使用者
    }
  }

  async function resumeOnSpotify() {
    if (await transferToDevice()) return;
    // 一台都沒有 = Spotify app 根本沒在跑。**只能把它叫起來,沒有辦法自動跳回來** ——
    // iOS 不讓網頁把自己帶回前景,那是平台限制。
    // 但使用者在 Spotify 裡不必按任何東西:app 一被打開就會重新登記成活躍裝置,
    // 等他自己切回來,下面 visibilitychange 那段會接手按播放。
    pendingWake = true;
    location.href = 'spotify:';
  }

  /**
   * 從 Spotify 切回來之後自己接手。要重試是因為**裝置登記有延遲** ——
   * app 剛回前景時 /me/player/devices 常常還是空的,第一次一定查不到。
   */
  async function wakeAfterReturn() {
    for (let i = 0; i < 4; i++) {
      if (await transferToDevice()) return;
      await new Promise((r) => setTimeout(r, 800));
    }
    setStatus('還是找不到裝置,請在 Spotify 裡按一次播放', true);
  }

  const togglePlay = () => (track && track.isPlaying)
    ? control('PUT', 'pause', { isPlaying: false, progressMs: positionAt(track, performance.now()) })
    : control('PUT', 'play', { isPlaying: true, progressMs: positionAt(track, performance.now()) });

  const seek = (ms) => {
    const pos = Math.max(0, Math.round(ms));
    return control('PUT', `seek?position_ms=${pos}`, { progressMs: pos });
  };

  // --- 歌詞 -----------------------------------------------------------------

  let lines = [];
  let activeLine = -1;
  let lyricsFor = null;    // 目前這份歌詞是哪個 track id 的 (慢回應蓋掉新歌的守門)
  let lyricsMeta = null;   // server 還原後的 (title, artist) —— 備選歌詞那兩支端點的鍵是它,不是 Spotify 給的原字串
  let gapMs = 0;           // 這首歌「一句多長」的中位數,段落循環的間奏防護要用

  const showEmpty = (text) => { $('lyrics').innerHTML = `<p class="empty">${escapeHtml(text)}</p>`; };

  /**
   * 換歌時打一次 Kanaric 的歌詞服務。頁面本來就是那台 server 服務的,所以用相對路徑 =
   * 同源請求;雲端模式那邊的允許清單只放行這一支,而且要帶 token。
   */
  async function loadLyrics(t) {
    lines = [];
    activeLine = -1;
    lyricsFor = t && t.id;
    lyricsMeta = null;
    clearLoop();            // 行號只對得上同一份歌詞
    loadOffset(t && t.id);
    clearInterval(optPoll); // 上一首的備選歌詞清單留著只會誤導
    $('opts').innerHTML = '';
    $('lyrics').innerHTML = '';
    $('lyrics-source').textContent = t ? '查詢中…' : '—';
    if (!t) return;
    showEmpty('查詢歌詞中…');

    // 快取命中就整個不打 server (規格 §4.3),離線時也還有歌詞
    const hit = readCache(localStorage, t.id);
    if (hit) return showLyrics(hit);

    // Render 免費方案閒置 15 分鐘就休眠,第一次請求要等 30~60 秒。**不要加 timeout 中斷它** ——
    // 中斷了就等於永遠喚不醒;改成等超過 3 秒就把狀態換掉,讓使用者知道不是當掉
    const waking = setTimeout(() => {
      if (lyricsFor !== t.id) return;
      $('lyrics-source').textContent = '喚醒伺服器中…';
      showEmpty('喚醒伺服器中…(免費方案冷啟動,約 30 秒)');
    }, 3000);

    try {
      const q = new URLSearchParams({ title: t.title, artist: t.artist, duration_ms: t.durationMs });
      const resp = await fetch(`/api/lyrics?${q}`, {
        cache: 'no-store',
        headers: { 'X-Kanaric-Token': localStorage.getItem(LS_TOKEN) || '' },
      });
      if (lyricsFor !== t.id) return;    // 這期間已經換歌了,舊回應丟掉
      // 401 是 token 不對,不是 Spotify 的事 —— 別把使用者踢回登入畫面
      if (resp.status === 401) throw new Error('歌詞服務 Token 不對');
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `server 回 ${resp.status}`);

      showLyrics(data);
      // 只快取真的有歌詞的:「找不到歌詞」存下去等於永遠不再重試
      if (lines.length) return writeCache(localStorage, t.id, data);
    } catch (e) {
      if (lyricsFor !== t.id) return;
      $('lyrics-source').textContent = `讀取失敗:${e.message}`;
    } finally {
      clearTimeout(waking);
    }
    // server 連不上 (電腦關機) 或它也沒有 —— 退到 lrclib,至少歌詞不會整個消失
    await loadFromLrclib(t);
  }

  /**
   * 備援 (規格 §4.2):前端直接打 lrclib 的公開 API。它有給 CORS header,所以瀏覽器打得到 ——
   * 中國平台那三家都沒有,而且 QQ/酷狗還要解密,手機端沒有路。
   */
  async function loadFromLrclib(t) {
    try {
      const q = new URLSearchParams({
        track_name: t.title,
        artist_name: t.artist.split(',')[0].trim(),   // lrclib 只吃單一歌手
        duration: Math.round(t.durationMs / 1000),
      });
      const resp = await fetch(`https://lrclib.net/api/get?${q}`, { cache: 'no-store' });
      if (lyricsFor !== t.id) return;
      if (!resp.ok) throw new Error(`lrclib 回 ${resp.status}`);
      const data = await resp.json();
      if (!data.syncedLyrics) throw new Error('lrclib 只有無時間軸的版本');
      // 這份沒經過 furigana_inject.py,沒有人幫它逃逸,自己來 (innerHTML 畫的)
      showLyrics({ source: 'lrclib(無注音)', lyrics: escapeHtml(data.syncedLyrics) });
      // 刻意不進快取:電腦開回來時要能換成有注音的那份
    } catch (e) {
      if (lyricsFor !== t.id) return;
      $('lyrics-source').textContent = `找不到歌詞:${e.message}`;
      showEmpty('找不到這首歌的歌詞');
    }
  }

  function showLyrics(data) {
    lines = parseLrc(data.lyrics);
    gapMs = medianGap(lines);
    // 備選歌詞的鍵要用 server 還原過的名字 (Spotify 給的是 Haru Dorobou / 魚韻),
    // 那兩支端點查的是同一個 optionJobs 鍵。lrclib 備援沒有這兩欄,退回原字串
    lyricsMeta = { title: data.title || (track && track.title), artist: data.artist || (track && track.artist) };
    $('lyrics-source').textContent = lines.length ? data.source : '找不到歌詞';
    if (!lines.length) return showEmpty('找不到這首歌的歌詞');
    // 歌詞是 furigana_inject.py 逃逸過的 <ruby> HTML,譯文則由 translations.js 的
    // escapeHtml 逃逸過 —— 兩邊都逃逸過了才敢直接 innerHTML
    $('lyrics').innerHTML = lines.map((l) =>
      `<p>${l.html || '♪'}${l.trans ? `<span class="tr">${l.trans}</span>` : ''}</p>`).join('');
  }

  /** 高亮 + 置中。只在換行時動,不然每幀寫 scrollTop 會把手動捲動整個吃掉 */
  function syncLyrics(posMs) {
    const i = activeIndex(lines, posMs);
    if (i === activeLine) return;
    const pane = $('lyrics');
    const prev = pane.children[activeLine];
    if (prev) prev.classList.remove('on');
    activeLine = i;
    const el = pane.children[i];
    if (!el) return;
    el.classList.add('on');
    pane.scrollTo({ top: el.offsetTop - pane.clientHeight / 2 + el.offsetHeight / 2, behavior: 'smooth' });
  }

  // --- 歌詞工具:微調時間軸 / 段落循環 / 重新載入 / 備選歌詞 ---------------------

  // 偏移**不走桌面的 sync_offsets 表**:那要 POST,而雲端那台是 GET-only;何況手機與桌面的
  // 視覺延遲本來就不同,共用一個值反而錯。一首一筆存在自己的 localStorage 裡。
  let offsetMs = 0;
  const OFFSET_MAX = 200;

  const readOffsets = () => { try { return JSON.parse(localStorage.getItem(LS_OFFSETS) || '{}'); } catch (e) { return {}; } };

  function loadOffset(id) {
    offsetMs = (id && readOffsets()[id] || 0) * 1000;
    renderTools();
  }

  /** delta 秒 (null = 歸零)。正值 = 歌詞延後 */
  function bumpOffset(delta) {
    if (!track) return;
    const sec = delta === null ? 0 : Math.round((offsetMs / 1000 + delta) * 10) / 10;
    offsetMs = sec * 1000;
    const all = readOffsets();
    if (sec) all[track.id] = sec; else delete all[track.id];
    for (const k of Object.keys(all).slice(0, -OFFSET_MAX)) delete all[k];
    try { localStorage.setItem(LS_OFFSETS, JSON.stringify(all)); } catch (e) { /* 配額滿了就這次不存 */ }
    // 立刻重算高亮,不然要等下一句才看得到差別 —— activeLine 歸零前要自己把舊的 .on 拿掉
    const cur = $('lyrics').querySelector('p.on');
    if (cur) cur.classList.remove('on');
    activeLine = -1;
    renderTools();
  }

  // A、B 存的是**行號**不是秒 (與桌面 app.js 同一套心智模型)
  let loopA = null, loopB = null, loopSeekUntil = 0;

  function clearLoop() {
    loopA = loopB = null;
    paintLoop();
    renderTools();
  }

  function paintLoop() {
    const ps = $('lyrics').children;
    for (const p of ps) p.classList.remove('loop');
    if (loopA === null) return;
    for (let i = loopA; i <= (loopB === null ? loopA : loopB); i++) if (ps[i]) ps[i].classList.add('loop');
  }

  function pickLoop(i) {
    if (loopA === null || loopB !== null) {
      loopA = i; loopB = null;      // 第一次長按,或已經選好一組要重選
    } else {
      loopB = i;                    // 再長按同一句 = 單句循環
      if (loopB < loopA) { const tmp = loopA; loopA = loopB; loopB = tmp; }   // 由下往上選也算數
      seek(lines[loopA].ms + offsetMs);
    }
    paintLoop();
    renderTools();
    $('tools').classList.remove('hidden');   // 讓使用者看得到目前設到哪、也才有地方取消
  }

  function renderTools() {
    $('off-val').textContent = `${offsetMs > 0 ? '+' : ''}${(offsetMs / 1000).toFixed(1)}s`;
    $('loop-val').textContent = loopA === null ? '長按歌詞設起點'
      : loopB === null ? `起點第 ${loopA + 1} 句,長按終點`
      : `第 ${loopA + 1} – ${loopB + 1} 句`;
    $('loop-clear').classList.toggle('hidden', loopA === null);
  }

  /** 重新載入:丟掉這首的本地快取再抓一次。**不是強制上網重抓** —— 雲端 cache 裡若是一份
      爛歌詞,重載還是它,那時要用的是備選歌詞 (語意與桌面 lyrics-tools.js 一致)。
      偏移值不清,那是使用者調的 */
  function reloadLyrics() {
    if (!track) return;
    let all;
    try { all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch (e) { all = {}; }
    delete all[track.id];
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(all)); } catch (e) {}
    closeSheet();
    loadLyrics(track);
  }

  /** 帶 token 的 GET。錯誤帶上 status,呼叫端才分得出 409 (選項過期) 與其他失敗 */
  async function apiGet(path) {
    const resp = await fetch(path, {
      cache: 'no-store',
      headers: { 'X-Kanaric-Token': localStorage.getItem(LS_TOKEN) || '' },
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const err = new Error(data.error || `server 回 ${resp.status}`);
      err.status = resp.status;
      throw err;
    }
    return data;
  }

  let optPoll = null;

  function optQuery() {
    return new URLSearchParams({ title: lyricsMeta.title, artist: lyricsMeta.artist });
  }

  /**
   * 搜尋備選歌詞。**不 await 那支開工作的端點** —— 整輪實測 25.7 秒,等在那裡就沒辦法
   * 中途換歌中止;進度改由 /options/state 每 2.5 秒問一次 (桌面是 1.5 秒,手機拉長省電)。
   * state 帶 brief=1:輪詢十幾次,每次夾帶五份完整歌詞就是幾百 KB 的行動網路流量。
   */
  function findOptions() {
    if (!lyricsMeta || !track) return;
    const id = track.id;
    const q = optQuery();
    $('opts').innerHTML = '<p class="hint">搜尋中…(冷啟動時最多要一分鐘)</p>';
    apiGet(`/api/lyrics/options?${q}`).catch(() => {});   // 失敗也不用管,state 那邊看得到
    clearInterval(optPoll);
    const started = Date.now();
    optPoll = setInterval(async () => {
      if (!track || track.id !== id) return clearInterval(optPoll);   // 換歌就中止
      try {
        const s = await apiGet(`/api/lyrics/options/state?${q}&brief=1`);
        renderOptions(s.options);
        // server 端的工作自己有 60 秒逾時,這裡多留 10 秒
        if (s.status === 'done' || Date.now() - started > 70000) clearInterval(optPoll);
      } catch (e) {
        clearInterval(optPoll);
        $('opts').innerHTML = `<p class="hint">搜尋失敗:${escapeHtml(e.message)}</p>`;
      }
    }, 2500);
  }

  function renderOptions(options) {
    if (!options || !options.length) return;   // 還沒有結果就留著「搜尋中」那行
    $('opts').innerHTML = options.map((o, i) =>
      `<button class="opt" data-i="${i}">${escapeHtml(o.title)}` +
      `<small>${escapeHtml(o.artist)} · ${escapeHtml(o.provider)} · ${o.isSynced ? 'LRC' : '純文字'}</small></button>`
    ).join('');
  }

  async function pickOption(i) {
    if (!lyricsMeta || !track) return;
    const id = track.id;
    $('opts').innerHTML = '<p class="hint">套用中…</p>';
    try {
      const data = await apiGet(`/api/lyrics/pick?${optQuery()}&index=${i}`);
      if (!track || track.id !== id) return;
      showLyrics(data);
      clearLoop();
      // 寫進自己的快取 = 持久化:它是 loadLyrics 的第一順位,所以「套用」會一直有效,
      // 直到按重新載入 (server 那邊完全沒被寫過)
      if (lines.length) writeCache(localStorage, id, data);
      closeSheet();
    } catch (e) {
      // 409 = server 那份工作不見了 (重啟、或被 20 筆上限淘汰),重跑一次搜尋就好
      if (e.status === 409) return findOptions();
      $('opts').innerHTML = `<p class="hint">套用失敗:${escapeHtml(e.message)}</p>`;
    }
  }

  /** 排下一次輪詢。分頁隱藏時不排 —— Safari 背景會凍結 timer,醒來也是靠 visibilitychange */
  function schedule(overrideMs) {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    const wait = overrideMs != null ? overrideMs : pollDelay(track);
    if (wait === Infinity) return;
    pollTimer = setTimeout(tick, wait);
  }

  async function tick() {
    schedule(await poll());
  }

  document.addEventListener('visibilitychange', () => {
    // 回到前景立刻校正一次:背景期間 timer 被凍結,插值早就漂掉了 (驗收標準 6)
    if (document.hidden) return clearTimeout(pollTimer);
    if ($('playbar').classList.contains('hidden')) return;
    keepAwake();   // 分頁一隱藏 lock 就被系統釋放,回前景一定要重拿 (規格 §5.3 點名的坑)
    // 剛從 Spotify 切回來:接手按播放,使用者在那邊什麼都不用按
    if (pendingWake) { pendingWake = false; return wakeAfterReturn(); }
    tick();
  });

  // --- 螢幕恆亮 -------------------------------------------------------------

  let wakeLock = null;

  async function keepAwake() {
    if (!('wakeLock' in navigator) || document.hidden || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
      wakeLock = null;   // 低電量模式會直接拒絕 —— 是正常情況,不用吵使用者
    }
  }

  // 進度條:rAF 每幀用 performance.now() 插值。分頁隱藏時瀏覽器自己會停掉 rAF,不必自己管
  function frame() {
    if (track) {
      const now = performance.now();
      const pos = positionAt(track, now);
      $('bar-fill').style.width = track.durationMs ? `${(pos / track.durationMs) * 100}%` : '0';
      $('pos-fmt').textContent = formatTime(pos);
      // 偏移只調歌詞,**進度條與時間不能減** —— 那是真實的播放位置 (桌面也是只調歌詞)
      syncLyrics(pos - offsetMs);
      // 段落循環。那個 2 秒的窗是必要的,不是防禦性程式:seek() 是樂觀更新,本地位置立刻
      // 跳回 A,但 400ms 後補的那次輪詢很可能拿到 Spotify 還沒跳完的舊位置 (≈B),
      // setTrack 一寫回去下一幀又觸發一次,就變成每秒狂送 seek 打爆限流。
      // 桌面用 pendingSeekTarget 擋同一件事 (app.js:70)。
      // ponytail: 循環段短於 2 秒會漏一次觸發,實務上沒有那麼短的段落
      if (loopB !== null && track.isPlaying && now > loopSeekUntil
          && pos - offsetMs >= loopEndMs(lines, loopB, gapMs, track.durationMs)) {
        loopSeekUntil = now + 2000;
        seek(lines[loopA].ms + offsetMs);
      }
    }
    requestAnimationFrame(frame);
  }

  // app.js:913 的 formatTime,毫秒版
  const formatTime = (ms) => {
    const total = Math.floor(ms / 1000);
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  };

  /** 每次輪詢回來時寫的欄位 (播放位置不在這裡,由 frame() 每幀插值寫) */
  function render(t) {
    $('track-title').textContent = t ? t.title : '—';
    $('track-artist').textContent = t ? t.artist : '—';
    $('dur-fmt').textContent = formatTime(t ? t.durationMs : 0);
    $('ico-play').classList.toggle('hidden', !!(t && t.isPlaying));
    $('ico-pause').classList.toggle('hidden', !(t && t.isPlaying));
    // 有歌在播就不需要那顆救援鈕;沒有裝置時 (204) 才留著
    if (t) $('resume-btn').classList.add('hidden');
    // 封面不顯示,但還是要換 src —— 背景色是從它採樣的。
    // src 只在真的換圖時寫:每次輪詢都寫同一個 URL 會讓 Safari 重新解碼一次
    const art = $('art'), url = (t && t.art) || '';
    if (art.getAttribute('src') !== url) {
      if (url) art.setAttribute('src', url); else { art.removeAttribute('src'); paintBg(FALLBACK); }
    }
    if (!t) { $('bar-fill').style.width = '0'; $('pos-fmt').textContent = '0:00'; }
  }

  // --- 封面主色 -------------------------------------------------------------

  function paintBg({ bg, dim }) {
    document.body.style.backgroundColor = bg;
    document.documentElement.style.setProperty('--lyric-dim', dim);
    document.querySelector('meta[name=theme-color]').setAttribute('content', bg);
  }

  // 圖載完才有像素可取。跨網域的 canvas 要靠 <img crossorigin> + CDN 給 CORS header,
  // i.scdn.co 兩者都有;真的取不到就退回 FALLBACK,不要讓整頁跟著壞掉
  $('art').addEventListener('load', function () {
    try {
      const c = document.createElement('canvas');
      // 縮到 32x32 再取樣:平均色跟原尺寸一樣,但少讀幾十萬個像素
      c.width = c.height = 32;
      const ctx = c.getContext('2d');
      ctx.drawImage(this, 0, 0, c.width, c.height);
      paintBg(pickBg(ctx.getImageData(0, 0, c.width, c.height).data));
    } catch (e) {
      paintBg(FALLBACK);
    }
  });
  $('art').addEventListener('error', () => paintBg(FALLBACK));

  // --- 畫面切換 -------------------------------------------------------------

  function showSetup() {
    clearTimeout(pollTimer);
    $('playbar').classList.add('hidden');
    showEmpty('連接 Spotify 後開始顯示歌詞');
    openSheet();
  }

  function showPlayer() {
    closeSheet();
    $('playbar').classList.remove('hidden');
    keepAwake();
  }

  // --- 進場 -----------------------------------------------------------------

  (async () => {
    applyPrefs(readPrefs());
    $('redirect-hint').textContent = REDIRECT_URI;
    $('menu-btn').addEventListener('click', openSheet);
    $('scrim').addEventListener('click', closeSheet);
    $('close-btn').addEventListener('click', closeSheet);
    $('login-btn').addEventListener('click', () => login().catch(e => setStatus(e.message, true)));
    $('logout-btn').addEventListener('click', logout);
    $('set-fs').addEventListener('input', (e) => savePrefs({ fs: Number(e.target.value) }));
    $('set-furigana').addEventListener('change', (e) => savePrefs({ furigana: e.target.checked }));
    $('set-trans').addEventListener('change', (e) => savePrefs({ trans: e.target.checked }));
    $('set-align').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) savePrefs({ align: b.dataset.align });
    });

    // 控制鈕:上一首/下一首走同一條路,播放鍵要看目前狀態
    for (const b of document.querySelectorAll('#ctrl [data-act]')) {
      b.addEventListener('click', () => control('POST', b.dataset.act));
    }
    $('play-btn').addEventListener('click', togglePlay);
    $('resume-btn').addEventListener('click', resumeOnSpotify);

    // 進度條點一下跳轉。**只做點擊不做拖曳** —— 拖曳要另外管 pointer 事件、還要在拖曳
    // 期間擋掉 rAF 對 width 的覆寫,多一整截程式碼;手機上點也比拖好按。
    // ponytail: 要拖曳的話在這裡加 pointerdown/move/up 並在拖曳中設一個旗標讓 frame() 早退
    $('prog-hit').addEventListener('click', (e) => {
      if (!track || !track.durationMs) return;
      const r = $('prog-hit').getBoundingClientRect();
      seek(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * track.durationMs);
    });

    // 點歌詞跳到那一句;長按 500ms 則是設段落循環的 A/B (不做模式開關)。
    // 時間戳本來就在 parseLrc 的結果裡,不必另外存
    const pane = $('lyrics');
    let pressTimer = null, pressAt = null, suppressClick = false;
    const lineOf = (e) => {
      const p = e.target.closest('p');
      if (!p || p.classList.contains('empty')) return -1;
      return [].indexOf.call(pane.children, p);
    };
    const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; pressAt = null; };

    pane.addEventListener('pointerdown', (e) => {
      // 在 pointerdown 清旗標而不是在 click 消耗掉:長按之後不一定會有 click 事件,
      // 留著 true 的話會吃掉下一次真正的點擊
      suppressClick = false;
      const i = lineOf(e);
      if (i < 0 || !lines[i]) return;
      pressAt = { x: e.clientX, y: e.clientY };
      pressTimer = setTimeout(() => {
        pressTimer = null;
        suppressClick = true;
        pickLoop(i);
      }, 500);
    });
    pane.addEventListener('pointerup', cancelPress);
    pane.addEventListener('pointercancel', cancelPress);
    pane.addEventListener('pointermove', (e) => {
      if (!pressAt) return;
      if (Math.abs(e.clientX - pressAt.x) > 10 || Math.abs(e.clientY - pressAt.y) > 10) cancelPress();
    });
    // 與 CSS 的 -webkit-touch-callout/user-select 是一組的,少一件就會看到 iOS 的選取泡泡
    pane.addEventListener('contextmenu', (e) => e.preventDefault());

    pane.addEventListener('click', (e) => {
      if (suppressClick) return;             // 剛剛那下是長按設循環點,不要順便跳轉
      const i = lineOf(e);
      if (lines[i]) seek(lines[i].ms + offsetMs);
    });

    // 工具條
    $('tools-btn').addEventListener('click', () => $('tools').classList.toggle('hidden'));
    $('off-minus').addEventListener('click', () => bumpOffset(-0.1));
    $('off-plus').addEventListener('click', () => bumpOffset(0.1));
    $('off-val').addEventListener('click', () => bumpOffset(null));
    $('loop-clear').addEventListener('click', clearLoop);

    // 抽屜裡的歌詞工具
    $('reload-btn').addEventListener('click', reloadLyrics);
    $('opts-btn').addEventListener('click', findOptions);
    $('opts').addEventListener('click', (e) => {
      const b = e.target.closest('.opt');
      if (b) pickOption(Number(b.dataset.i));
    });

    requestAnimationFrame(frame);
    // SW 要 secure context:雲端的 HTTPS 與 127.0.0.1 都算,直接開檔案不算 (失敗就算了)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    // 進場就先射一發把休眠中的 server 叫醒 (免費方案冷啟動 30~60 秒),跟下面的 Spotify
    // 授權/輪詢平行跑 —— 等歌名確定要打 /api/lyrics 時,它已經醒了一段時間。
    // **打靜態檔不打 /api/lyrics**:那支會查 DB、spawn Python、對外打三家平台,拿它當喚醒
    // 等於每次開 app 都多一輪對外請求,可能害雲端那台的 IP 被三家限流。
    // 不 await、不理錯誤:這只是喚醒,失敗了 loadLyrics 自己會再打一次。
    // 帶 ?wake 是為了讓 SW 放行走網路 —— 不帶的話會被 shell 快取接走,根本沒碰到 server。
    fetch('manifest.json?wake=1', { cache: 'no-store' }).catch(() => {});

    try {
      if (await handleRedirect()) {
        showPlayer();
        return tick();
      }
    } catch (e) {
      setStatus(`換 token 失敗:${e.message}`, true);
      return showSetup();
    }

    // 存著的 refresh_token 是舊 scope 換來的話,播放控制會回 403 而看起來像 Premium 沒生效。
    // 與其讓使用者卡在一個猜不到原因的狀態,不如直接請他重新連接一次。
    if (localStorage.getItem(LS_REFRESH) && localStorage.getItem(LS_SCOPE) !== SCOPE) {
      localStorage.removeItem(LS_REFRESH);
      setStatus('功能有更新,請重新連接 Spotify');
    }

    if (localStorage.getItem(LS_REFRESH) && clientId()) { showPlayer(); tick(); }
    else showSetup();
  })();
})();
</script>
</body>
</html>
